<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Modal</title>
<style>
    .modal-container {
        display: none;
        position: fixed;
        left: 0;
        bottom: 2rem;
        width: 100%;
        transition: opacity 0.3s ease;
        z-index: 9999;
    }

    .service-Content {
        position: relative;
        background-color: #fff;
        margin: auto;
        padding: 20px;
        box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.5);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        border-top-right-radius: 20px;
        border-top-left-radius: 20px;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        cursor: pointer;
    }
</style>
</head>
<body>

<button onclick="openServicemodal()">Open Modal</button>

<div id="serviceContainer" class="modal-container">
    <div id="serviceContent" class="service-Content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2>Modal Title</h2>
        <p>Modal content goes here.</p>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam vitae exercitationem ex aspernatur, repudiandae doloremque quo ducimus dignissimos, fuga dolorum velit laborum architecto, nisi doloribus libero ipsum alias facere corrupti?</p>
    </div>
</div>

<script>
    var serviceContainer = document.getElementById("serviceContainer");
    var serviceContent = document.getElementById("serviceContent");

    function openServicemodal() {
        serviceContainer.style.display = "block";
        setTimeout(function () {
            serviceContent.style.transform = "translateY(0%)";
        }, 10);
    }

    function closeModal() {
        serviceContent.style.transform = "translateY(100%)";
        setTimeout(function () {
            serviceContainer.style.display = "none";
        }, 300); 
    }
</script>

</body>
</html>
